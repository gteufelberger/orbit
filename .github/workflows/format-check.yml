name: Linting

on:
  push:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Check formatting
        run: bun run lint

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Formatting
        run: cargo fmt --manifest-path orbit_lib/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path orbit_lib/Cargo.toml -- --no-deps --deny warnings

      - name: Tests and binding generation
        run: cargo test --manifest-path orbit_lib/Cargo.toml

      - name: Bindings up to date
        run: |
          git diff --exit-code orbit_lib/bindings
          test -z "$(git status --porcelain orbit_lib/bindings)"
